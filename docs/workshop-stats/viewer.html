<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>계열 뷰어 — 자료 워크숍</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="viewer">
<div class="vbar">
  <a href="index.html">← 안내</a>
  <a href="catalog.html">표 카탈로그</a>
  <button id="prev" title="이전 쪽">‹ 이전</button><button id="next" title="다음 쪽">다음 ›</button>
  <label>배율 <select id="zoom"><option value="1">1×</option><option value="1.5">1.5×</option><option value="2">2×</option><option value="3">3×</option></select></label>
  <span class="warn">인용 불가 상태(열 매핑 미완·OCR 미대조). 워크숍 안에서만.</span>
  <span class="meta" id="meta"></span>
</div>
<div class="vwrap">
  <div class="vside">
    <div class="sel">
      <select id="series"></select>
      <div class="sinfo" id="sinfo"></div>
    </div>
    <ul id="plist"></ul>
  </div>
  <div class="vimg" id="vimg"><div class="stage"><img id="img" alt="지면"><div class="guide" id="guide"><span id="gx"></span></div></div><div class="noimg" id="noimg" style="display:none">이 쪽의 지면 이미지가 없다.</div></div>
  <div class="vtab" id="vtab"></div>
</div>
<script>
'use strict';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const JKEY='ws_judg_v1';
let M=null, S=null, D=null, I=0, C={};   // manifest, 계열, 계열 데이터, 쪽 인덱스, 계열 캐시
let chartOpt={mode:'col',col:'0',block:'',x0:0.3,x1:0.4,all:false,regions:null};

fetch('manifest.json').then(r=>r.json()).then(m=>{M=m;init();});

function init(){
  const ss=$('#series');
  for(const k of Object.keys(M.series)){
    const s=M.series[k];
    ss.add(new Option(s.failed?`${k} (값 0행 — 실패 표본)`:`${k} (${s.editions[0]}~${s.editions[s.editions.length-1]}판)`,k));
  }
  ss.onchange=()=>{load(ss.value,0);};
  $('#prev').onclick=()=>{if(I>0){I--;show();}};
  $('#next').onclick=()=>{if(D&&I<D.pages.length-1){I++;show();}};
  $('#zoom').onchange=e=>{$('#img').style.width=(100*+e.target.value)+'%';};
  window.onhashchange=fromHash;
  // 옛 ?s=&e= 링크도 받는다
  const q=new URLSearchParams(location.search);
  if(!location.hash&&q.get('s')) location.hash='#'+encodeURIComponent(q.get('s'))+(q.get('e')?'/'+q.get('e'):'');
  fromHash(true);
}
function fromHash(first){
  const h=decodeURIComponent(location.hash.slice(1));
  const [s,e,p]=h.split('/');
  const ser=(s&&M.series[s])?s:(S||Object.keys(M.series)[0]);
  if(ser!==S){load(ser,0,e,p);return;}
  if(!D)return;
  const i=findPage(e,p); if(i>=0&&i!==I){I=i;show();}
}
function findPage(e,p){
  if(!e)return -1;
  let i=D.pages.findIndex(x=>x.edition===e&&(!p||x.page===p));
  if(i<0)i=D.pages.findIndex(x=>x.edition===e);
  return i;
}
function load(s,i,e,p){
  S=s; $('#series').value=s; I=i||0; D=null;
  $('#vtab').innerHTML='<p class="small">불러오는 중…</p>';
  const go=d=>{D=d;const j=findPage(e,p);if(j>=0)I=j;fillList();show();};
  if(C[s])go(C[s]); else fetch(`data/${encodeURIComponent(s)}.json`).then(r=>r.json()).then(d=>{C[s]=d;go(d);});
  const m=M.series[s];
  $('#sinfo').innerHTML=m.failed?`값 0행 · 표본 지면 ${m.pages.length}장`:`${m.editions.length}판 · ${m.pages.length}쪽 · ${m.rows.toLocaleString()}행<br>지역 ${m.regions.length} · 갱신 ${m.updated}`;
}
function fillList(){
  const ul=$('#plist'); ul.innerHTML='';
  let lastEd=null;
  D.pages.forEach((p,i)=>{
    const li=document.createElement('li');
    li.className=p.img?'':'noimg';
    li.innerHTML=`<span>${p.edition===lastEd?'&nbsp;&nbsp;└ ':''}${esc(p.edition)}판 ${esc(p.page)}쪽</span><span class="n">${p.rows.length||''}</span>`;
    li.title=p.table||'';
    li.onclick=()=>{I=i;show();};
    ul.appendChild(li); lastEd=p.edition;
  });
}
function show(){
  const p=D.pages[I]; if(!p)return;
  location.hash=`#${encodeURIComponent(S)}/${p.edition}/${p.page}`;
  const lis=$('#plist').children;
  for(let k=0;k<lis.length;k++){lis[k].classList.toggle('on',k===I);}
  if(lis[I])lis[I].scrollIntoView({block:'nearest'});
  const img=$('#img');
  if(p.img){img.style.display='';img.src=p.img;$('#noimg').style.display='none';}
  else{img.style.display='none';img.removeAttribute('src');$('#noimg').style.display='';}
  $('#vimg').scrollTop=0;
  $('#guide').style.display='none';
  $('#meta').textContent=`${S} · ${p.edition}판 ${p.page}쪽 · ${p.table||''}`;
  const t=$('#vtab');
  if(D.failed){
    t.innerHTML=`<p><strong>${esc(p.edition)}판 ${esc(p.page)}쪽 — ${esc(p.table)}</strong></p>
      <p class="small">이 표에서 추출기는 값을 한 행도 뽑지 못했다. 머리글로 읽힌 것은 아래와 같다. 지면과 견주어 <em>왜</em> 실패했는지 생각해 볼 것.</p>
      <div class="hdr">${esc(p.header)}</div>`;
    return;
  }
  const ci=Object.fromEntries(D.cols.map((c,i)=>[c,i]));
  const R=p.rows.map(r=>Object.fromEntries(D.cols.map((c,i)=>[c,r[i]])));
  const regions=[...new Set(R.map(r=>r.region))];
  const blocks=[...new Set(R.map(r=>r.block))];
  let h=`<h4>표머리 (기계 판독)</h4><div class="hdr">${esc(p.header)||'(없음)'}</div>`;
  h+=`<h4>계열 시계열 (같은 열순번 또는 x구간의 값을 판별로 이어 본다 — 열 이름은 표시하지 않는다)</h4><div class="chartbox" id="chart"></div>`;
  h+=`<h4>이 쪽의 추출 행 ${R.length}개</h4>`;
  h+=`<div class="filter">지역: ${regions.map(r=>`<label><input type="checkbox" class="fr" value="${esc(r)}" checked> ${esc(r)}</label>`).join('')}
      <br>블록: ${blocks.map(b=>`<label><input type="checkbox" class="fb" value="${esc(b)}" checked> ${esc(b)}</label>`).join('')}
      &nbsp; <label><input type="checkbox" id="onlyf"> 플래그만</label></div>`;
  h+=`<table><thead><tr><th>지역</th><th>블록</th><th>열</th><th>x위치</th><th>원문</th><th>값</th><th>신뢰도</th><th>플래그</th><th>판정</th><th>수정값</th><th>열이름</th><th>이유</th><th>행원문</th></tr></thead><tbody>`;
  const J=loadJ();
  R.forEach((r,i)=>{
    const k=jkey(p,i), j=J[k]||{};
    h+=`<tr data-i="${i}" data-x="${r.x}" data-r="${esc(r.region)}" data-b="${esc(r.block)}" class="${r.flag?'f ':''}${jcls(j.j)}">
      <td>${esc(r.region)}</td><td>${esc(r.block)}</td><td>${esc(r.col_idx)}</td><td>${(+r.x).toFixed(3)}</td><td>${esc(r.raw)}</td><td>${esc(r.value)}</td><td>${esc(r.conf)}</td>
      <td>${r.flag?`<span class="tag f">${esc(r.flag)}</span>`:''}</td>
      <td class="j"><select data-k="${k}" data-f="j"><option value="">–</option>${['살림','버림','보류'].map(o=>`<option${j.j===o?' selected':''}>${o}</option>`).join('')}</select></td>
      <td class="j"><input class="v" data-k="${k}" data-f="v" value="${esc(j.v||'')}" placeholder="수정값"></td>
      <td class="j"><input class="c" data-k="${k}" data-f="c" value="${esc(j.c||'')}" placeholder="내가 정한 열"></td>
      <td class="j"><input class="w" data-k="${k}" data-f="w" value="${esc(j.w||'')}" placeholder="이유"></td>
      <td class="rt">${esc(r.row_text)}</td></tr>`;
  });
  h+=`</tbody></table><p class="small">행에 마우스를 올리면 지면에 세로선, 클릭하면 그 x위치로 지면을 밀어 준다. 같은 열이면 x가 비슷하다.</p>`;
  h+=`<div class="jpanel"><strong>판정 기록</strong> <span id="jcnt"></span> — 이 브라우저에만 저장된다(localStorage).
      <button id="jexp">CSV 내보내기</button><button id="jclr">모두 지우기</button>
      <div class="small">내보낸 CSV는 <a href="data/판정기록_양식.csv" download>판정기록_양식.csv</a>와 같은 열 + 수정값 열. 대조한 원본 칸은 판·쪽으로 채워 둔다.</div></div>`;
  t.innerHTML=h;
  // 세로선·스크롤
  t.querySelectorAll('tbody tr').forEach(tr=>{
    tr.onmouseenter=()=>{const x=+tr.dataset.x; const g=$('#guide'); g.style.left=(x*100)+'%'; g.style.display='block'; $('#gx').textContent='x='+x.toFixed(2);};
    tr.onmouseleave=()=>{$('#guide').style.display='none';};
    tr.onclick=e=>{if(e.target.closest('.j'))return;const st=$('#vimg'); const im=$('#img'); st.scrollLeft=Math.max(0,(+tr.dataset.x)*im.clientWidth-st.clientWidth/2);};
  });
  // 필터
  const apply=()=>{
    const rs=new Set([...t.querySelectorAll('.fr:checked')].map(c=>c.value));
    const bs=new Set([...t.querySelectorAll('.fb:checked')].map(c=>c.value));
    const of=$('#onlyf').checked;
    t.querySelectorAll('tbody tr').forEach(tr=>{tr.style.display=(rs.has(tr.dataset.r)&&bs.has(tr.dataset.b)&&(!of||tr.classList.contains('f')))?'':'none';});
  };
  t.querySelectorAll('.fr,.fb,#onlyf').forEach(c=>c.onchange=apply);
  // 판정 저장
  t.querySelectorAll('.j select,.j input').forEach(el=>{
    el.onchange=()=>{
      const k=el.dataset.k, i=+el.closest('tr').dataset.i, r=R[i];
      const J=loadJ(); const j=J[k]||{};
      j[el.dataset.f]=el.value;
      if(!j.j&&!j.v&&!j.c&&!j.w){delete J[k];}
      else{Object.assign(j,{s:S,e:p.edition,p:p.page,region:r.region,block:r.block,x:r.x,raw:r.raw,value:r.value,t:new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,16).replace('T',' ')});J[k]=j;}
      saveJ(J); el.closest('tr').className=el.closest('tr').className.replace(/\bj[kd]\b/g,'').trim()+' '+jcls(j.j); jcount();
    };
  });
  $('#jexp').onclick=exportJ; $('#jclr').onclick=()=>{if(confirm('이 브라우저의 판정 기록을 모두 지울까요? 먼저 CSV로 내보내 두세요.')){localStorage.removeItem(JKEY);show();}};
  jcount();
  drawChart(p);
}
/* ---------- 판정 기록 ---------- */
const jkey=(p,i)=>`${S}|${p.edition}|${p.page}|${i}`;
const jcls=j=>j==='살림'?'jk':j==='버림'?'jd':'';
function loadJ(){try{return JSON.parse(localStorage.getItem(JKEY)||'{}');}catch(e){return {};}}
function saveJ(J){localStorage.setItem(JKEY,JSON.stringify(J));}
function jcount(){const J=loadJ();const n=Object.keys(J).length;const m=Object.values(J).filter(j=>j.s===S).length;$('#jcnt').textContent=`전체 ${n}건 (이 계열 ${m}건)`;}
function exportJ(){
  const J=loadJ(); const ks=Object.keys(J);
  if(!ks.length){alert('기록이 없다.');return;}
  const cols=['계열','지역','블록','판','쪽','x위치','원문','값','내가 정한 열 이름','판정(살림/버림/보류)','이유','대조한 원본(판·쪽)','비고','수정값','기록시각'];
  const q=v=>{v=String(v??'');return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;};
  let out='﻿'+cols.join(',')+'\n';
  ks.sort().forEach(k=>{const j=J[k];out+=[j.s,j.region,j.block,j.e,j.p,j.x,j.raw,j.value,j.c||'',j.j||'',j.w||'',`${j.e}·${j.p}`,'',j.v||'',j.t||''].map(q).join(',')+'\n';});
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([out],{type:'text/csv;charset=utf-8'}));
  a.download=`판정기록_${new Date().toISOString().slice(0,10).replace(/-/g,'')}.csv`; a.click();
}
/* ---------- 미니차트 (순수 SVG) ---------- */
function drawChart(p){
  const box=$('#chart'); if(!box)return;
  const m=M.series[S];
  const cols=[...new Set(D.pages.flatMap(pg=>pg.rows.map(r=>r[2])))].sort((a,b)=>+a-+b);
  const pref=['광주','전남','전국'].filter(r=>m.regions.includes(r));
  if(!chartOpt.regions||!chartOpt.regions.some(r=>m.regions.includes(r))) chartOpt.regions=pref.length?pref:m.regions.slice(0,3);
  if(!m.blocks.includes(chartOpt.block)) chartOpt.block=m.blocks.includes('전체')?'전체':m.blocks[0];
  if(!cols.includes(chartOpt.col)) chartOpt.col=cols[0]||'0';
  const o=chartOpt;
  box.innerHTML=`<div class="ctl">
    <label>기준 <select id="cmode"><option value="col"${o.mode==='col'?' selected':''}>열순번</option><option value="x"${o.mode==='x'?' selected':''}>x구간</option></select></label>
    <label id="lcol"${o.mode==='x'?' style="display:none"':''}>열 <select id="ccol">${cols.map(c=>`<option${c===o.col?' selected':''}>${esc(c)}</option>`).join('')}</select></label>
    <span id="lx"${o.mode==='col'?' style="display:none"':''}>x <input type="number" id="cx0" step="0.01" min="0" max="1" value="${o.x0}"> ~ <input type="number" id="cx1" step="0.01" min="0" max="1" value="${o.x1}"></span>
    <label>블록 <select id="cblk">${m.blocks.map(b=>`<option${b===o.block?' selected':''}>${esc(b)}</option>`).join('')}</select></label>
    <span>지역 ${m.regions.map(r=>`<label style="margin-right:.4rem"><input type="checkbox" class="cr" value="${esc(r)}"${o.regions.includes(r)?' checked':''}> ${esc(r)}</label>`).join('')}</span>
    <label><input type="checkbox" id="call"${o.all?' checked':''}> 전체 값(저신뢰·플래그 포함)</label>
  </div><div id="csvg"></div><div class="tip" id="ctip">점 위에 마우스: 값·원문·신뢰도. 클릭: 그 판으로 이동. 기본은 신뢰도≥0.5·플래그 없는 값만.</div>`;
  const re=()=>{o.mode=$('#cmode').value;o.col=$('#ccol').value;o.block=$('#cblk').value;o.x0=+$('#cx0').value;o.x1=+$('#cx1').value;o.all=$('#call').checked;
    o.regions=[...box.querySelectorAll('.cr:checked')].map(c=>c.value).slice(0,6);
    $('#lcol').style.display=o.mode==='col'?'':'none';$('#lx').style.display=o.mode==='x'?'':'none';render();};
  box.querySelectorAll('select,input').forEach(el=>el.onchange=re);
  function render(){
    // 판별로 (region → 첫 매칭 값)
    const eds=m.editions; const pts={};
    o.regions.forEach(r=>pts[r]=[]);
    D.pages.forEach(pg=>{
      pg.rows.forEach(r=>{
        const [block,region,col,x,raw,value,conf,flag]=r;
        if(block!==o.block||!pts[region])return;
        if(o.mode==='col'?col!==o.col:!(+x>=o.x0&&+x<=o.x1))return;
        if(!o.all&&(+conf<0.5||flag))return;
        const v=parseFloat(String(value).replace(/,/g,'')); if(!isFinite(v))return;
        if(pts[region].some(q=>q.e===pg.edition))return;   // 판당 첫 값
        pts[region].push({e:pg.edition,v,raw,conf,flag,p:pg.page});
      });
    });
    const all=Object.values(pts).flat();
    if(!all.length){$('#csvg').innerHTML='<p class="small">조건에 맞는 값이 없다. 열·블록·지역을 바꾸거나 "전체 값"을 켜 볼 것.</p>';return;}
    const W=600,H=200,L=52,Rm=10,T=10,B=24;
    const ymax=Math.max(...all.map(q=>q.v)), ymin=Math.min(0,...all.map(q=>q.v));
    const ex=e=>L+(eds.indexOf(e))*(W-L-Rm)/Math.max(1,eds.length-1);
    const ey=v=>T+(H-T-B)*(1-(v-ymin)/((ymax-ymin)||1));
    const colors=['var(--c1)','var(--c2)','var(--c3)','#7a9a2b','#9a5aa8','#c48a1a'];
    let s=`<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" font-size="10" font-family="inherit">`;
    // 축
    [0,.5,1].forEach(f=>{const v=ymin+(ymax-ymin)*f, y=ey(v); s+=`<line x1="${L}" x2="${W-Rm}" y1="${y}" y2="${y}" stroke="#ddd"/><text x="${L-4}" y="${y+3}" text-anchor="end" fill="#666">${fmt(v)}</text>`;});
    const step=Math.ceil(eds.length/8);
    eds.forEach((e,i)=>{if(i%step===0||i===eds.length-1)s+=`<text x="${ex(e)}" y="${H-6}" text-anchor="middle" fill="#666">${e}</text>`;});
    // 현재 판 표시
    s+=`<line x1="${ex(p.edition)}" x2="${ex(p.edition)}" y1="${T}" y2="${H-B}" stroke="#bbb" stroke-dasharray="3 3"/>`;
    o.regions.forEach((r,ri)=>{
      const q=pts[r].sort((a,b)=>+a.e-+b.e); if(!q.length)return;
      s+=`<polyline fill="none" stroke="${colors[ri%colors.length]}" stroke-width="1.5" points="${q.map(d=>`${ex(d.e)},${ey(d.v)}`).join(' ')}"/>`;
      q.forEach(d=>{s+=`<circle cx="${ex(d.e)}" cy="${ey(d.v)}" r="3" fill="${colors[ri%colors.length]}" data-e="${d.e}" data-p="${d.p}" data-t="${esc(`${r} ${d.e}판 ${d.p}쪽 · 값 ${d.v} · 원문 ${d.raw} · 신뢰도 ${d.conf}${d.flag?' · '+d.flag:''}`)}" style="cursor:pointer"/>`;});
    });
    s+=`</svg><div class="lg">${o.regions.map((r,ri)=>`<i style="background:${colors[ri%colors.length]}"></i>${esc(r)} (${pts[r].length})`).join('')} · 판 ${eds.length}개</div>`;
    $('#csvg').innerHTML=s;
    box.querySelectorAll('circle').forEach(c=>{
      c.onmouseenter=()=>{$('#ctip').textContent=c.dataset.t;};
      c.onclick=()=>{const i=findPage(c.dataset.e,c.dataset.p);if(i>=0){I=i;show();}};
    });
  }
  render();
}
const fmt=v=>Math.abs(v)>=1e6?(v/1e6).toFixed(1)+'M':Math.abs(v)>=1e4?(v/1e3).toFixed(0)+'k':(+v.toFixed(2)).toString();
</script>
</body>
</html>
